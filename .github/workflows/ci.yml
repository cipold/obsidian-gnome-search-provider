name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install system dependencies for PyGObject
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-glib-2.0 libcairo2-dev libgirepository1.0-dev libgirepository-2.0-dev

    - name: Install uv
      uses: astral-sh/setup-uv@v9
      with:
        enable-cache: true

    - name: Check formatting and linting
      run: |
        uv sync
        make lint
